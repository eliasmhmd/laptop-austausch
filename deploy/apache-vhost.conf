# Apache-VirtualHost für Laptop-Austausch (HTTP, Port 80).
# deploy/setup.sh ersetzt __APP_DIR__ und __SERVER_NAME__ automatisch und
# schreibt die fertige Datei nach /etc/apache2/sites-available/laptop-austausch.conf.

<VirtualHost *:80>
    ServerName __SERVER_NAME__

    # Laravel wird aus dem public/-Ordner ausgeliefert.
    DocumentRoot __APP_DIR__/public

    <Directory __APP_DIR__/public>
        # Laravels public/.htaccess (mod_rewrite) muss greifen dürfen.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/laptop-austausch-error.log
    CustomLog ${APACHE_LOG_DIR}/laptop-austausch-access.log combined
</VirtualHost>
